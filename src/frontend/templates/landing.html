<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Fintech AI Assistant</title>
    <link rel="stylesheet" href="/static/style.css">

    <style>
        /* ----- Global Reset ----- */
        body {
            margin: 0;
            padding: 0;
            font-family: "Inter", "Segoe UI", sans-serif;
            background: linear-gradient(135deg, #0a192f, #0f2944, #15395b);
            color: #e6eef7;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* ----- Glass Container ----- */
        .glass-card {
            width: 92%;
            max-width: 720px;
            padding: 40px;
            border-radius: 24px;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            text-align: center;
            box-shadow: 0 8px 35px rgba(0, 0, 0, 0.3);
        }

        /* ----- Title ----- */
        h1 {
            font-size: 34px;
            margin-bottom: 10px;
            background: linear-gradient(90deg, #6ec7ff, #a6e0ff, #f0f9ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 700;
        }

        /* ----- Subtitle ----- */
        p {
            font-size: 18px;
            margin-top: 0;
            margin-bottom: 30px;
            opacity: 0.85;
            line-height: 1.6;
        }

        /* ----- CTA Button ----- */
        .cta-btn {
            display: inline-block;
            padding: 16px 32px;
            border-radius: 50px;
            font-size: 18px;
            font-weight: 600;
            text-decoration: none;
            color: #0a1a2f;
            background: linear-gradient(135deg, #a8ebff, #6cc9ff);
            box-shadow: 0 4px 15px rgba(0, 140, 255, 0.4);
            transition: 0.2s ease-in-out;
        }

        .cta-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(0, 140, 255, 0.55);
        }

        /* ----- Footer ----- */
        .footer {
            margin-top: 28px;
            font-size: 14px;
            color: #cfd9e6;
            opacity: 0.5;
        }
    </style>
</head>

<body>

    <div class="glass-card">
        <h1>💬 Fintech AI Assistant</h1>

        <p>
            Your intelligent, secure, retrieval-augmented FAQ assistant.<br>
            Powered by **FAISS + Phi-3.5-Mini-Instruct + Hybrid Grounding**.<br>
            Zero hallucinations. Fully explainable. Enterprise-grade.
        </p>

        <!-- CTA Button to the Streamlit Chat UI -->
        <a class="cta-btn" href="/chat">Open AI Assistant</a>

        <div class="footer">
            © 2025 Fintech AI | Privacy-First · Secure · Context-Grounded
        </div>
    </div>

</body>
</html>
