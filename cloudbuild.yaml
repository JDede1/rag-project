# ================================================
# Cloud Build — RAG Backend (No Cache Build)
# ================================================

# Disable Cloud Build Docker cache indirectly by enabling BuildKit
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: "E2_HIGHCPU_8"
  env:
    - DOCKER_BUILDKIT=1

# ================================================
# Build + Push Steps
# ================================================
steps:
  # ------------------------------------------------
  # 1. Build Docker image (no cache)
  # ------------------------------------------------
  - name: "gcr.io/cloud-builders/docker"
    args:
      [
        "build",
        "-t", "$_AR_IMAGE",
        "--no-cache",
        "."
      ]

  # ------------------------------------------------
  # 2. Push image to Artifact Registry
  # ------------------------------------------------
  - name: "gcr.io/cloud-builders/docker"
    args:
      [
        "push",
        "$_AR_IMAGE"
      ]

# ================================================
# Output image for downstream deployment steps
# ================================================
images:
  - "$_AR_IMAGE"
