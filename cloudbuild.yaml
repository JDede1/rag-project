# ============================================================
# Cloud Build — Build + Push RAG Backend Image
# ============================================================

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: "E2_HIGHCPU_8"
  env:
    - DOCKER_BUILDKIT=1

steps:

  # ----------------------------------------------------------
  # 1. Build Docker Image (NO CACHE)
  # ----------------------------------------------------------
  - name: "gcr.io/cloud-builders/docker"
    args:
      [
        "build",
        "--no-cache",
        "-t", "$_AR_IMAGE",
        "."
      ]

  # ----------------------------------------------------------
  # 2. Push to Artifact Registry
  # ----------------------------------------------------------
  - name: "gcr.io/cloud-builders/docker"
    args:
      [
        "push",
        "$_AR_IMAGE"
      ]

# ------------------------------------------------------------
# Output image for downstream processes
# ------------------------------------------------------------
images:
  - "$_AR_IMAGE"
