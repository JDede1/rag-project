# ============================================================
# Cloud Build for RAG Backend (Docker → Artifact Registry)
# With forced no-cache rebuild
# ============================================================

steps:
  # ----------------------------------------------------------
  # 1) Build Docker image with NO CACHE
  # ----------------------------------------------------------
  - name: "gcr.io/cloud-builders/docker"
    args:
      [
        "build",
        "--no-cache",
        "--pull",
        "-t", "$_AR_IMAGE",
        "."
      ]

  # ----------------------------------------------------------
  # 2) Push Docker image to Artifact Registry
  # ----------------------------------------------------------
  - name: "gcr.io/cloud-builders/docker"
    args:
      [
        "push",
        "$_AR_IMAGE"
      ]

images:
  - "$_AR_IMAGE"
