# ============================================================
# Cloud Build for RAG Backend (Docker → Artifact Registry)
# ============================================================

steps:
  # ----------------------------------------------------------
  # 1) Build Docker image
  # ----------------------------------------------------------
  - name: "gcr.io/cloud-builders/docker"
    args:
      [
        "build",
        "-t", "$_AR_IMAGE",
        "."
      ]

  # ----------------------------------------------------------
  # 2) Push Docker image to Artifact Registry
  # ----------------------------------------------------------
  - name: "gcr.io/cloud-builders/docker"
    args:
      [
        "push",
        "$_AR_IMAGE"
      ]

# ------------------------------------------------------------
# 3) Register image as build output
# ------------------------------------------------------------
images:
  - "$_AR_IMAGE"
